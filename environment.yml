name: gwtc_forecast
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip>=24
  - setuptools>=69
  - wheel

  # Match the public GWTC-5 population-release numerical baseline where useful.
  - numpy=2.3.2
  - scipy=1.16.1
  - matplotlib-base=3.10.5

  - pandas>=2.2,<3
  - h5py>=3.10,<4
  - pyyaml>=6,<7
  - requests>=2.31,<3
  - tqdm>=4.66,<5
  - astropy>=6,<8

  - ipython>=8,<10
  - ipykernel>=6,<7
  - jupyterlab>=4,<5
  - nbformat>=5.10,<6

  - pytest>=8,<10
  - pytest-cov>=5,<7
  - ruff>=0.8,<1

  - pip:
      # Bilby 2.6.0 is the version named by the official GWTC-5 population
      # release environment. The remaining pins are current public interfaces
      # used for reading and eventual population calculations.
      - bilby==2.7.1
      - gwpopulation==1.3.1
      - pesummary==1.7.0
      - popsummary==0.1.0
      - zenodo-get==2.0.0
